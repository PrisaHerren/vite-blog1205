name: Punch Action
run-name: Punch Action

on:
  schedule:
    - cron: "05 7 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "05 16 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:

# 加入這段環境變數，強制讓 Actions 使用 Node 24 執行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  Punch-Action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python Dependency
        run: pip3 install requests
      - name: Install Dependencies
        run: |
          pip install pytz
          pip install playwright requests
          # 必須安裝 chromium 瀏覽器及其系統依賴
          pip install pytz playwright  # <--- 確保有 pytz
          playwright install chromium --with-deps

      - name: Run punch.py
        run: python punch.py
    
